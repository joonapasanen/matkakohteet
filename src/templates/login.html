{% extends "layout.html" %} {% block title %}Kirjautuminen{% endblock %} {%
block content %}

<div>
  <h1>Kirjautuminen</h1>
  <form action="/login_form" method="POST">
    <p>
      <input type="text" name="username" placeholder="Käyttäjänimi" required />
    </p>
    <p>
      <input type="password" name="password" placeholder="Salasana" required />
    </p>
    <button type="submit">Kirjaudu sisään</button>
  </form>
  <p>Eikö sinulla ole tiliä? <a href="/register">Luo tili</a>.</p>
</div>

{% endblock %}
