{% extends "layout.html" %} {% block title %}Käyttäjän luonti{% endblock %} {%
block content %} {% for message in get_flashed_messages() %}
<p>
  <b>{{ message }}</b>
</p>
{% endfor %}

<div>
  <h2>Rekisteröidy</h2>
  <form action="/register" method="POST">
    <p>
      Tunnus: <br />
      <input type="text" name="username" value="{{ filled.username }}" />
    </p>
    <p>
      Salasana: <br />
      <input type="password" name="password1" />
    </p>
    <p>
      Salasana uudestaan: <br />
      <input type="password" name="password2" />
    </p>
    <input type="submit" value="Luo tunnus" />
  </form>
  <hr />
  <p>Onko sinulla jo tili? <a href="/login">Kirjaudu sisään</a>.</p>
</div>

{% endblock %}
