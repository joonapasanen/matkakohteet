<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hakutulokset</title>
  </head>
  <body>
    {% if query %}
    <h1>Tulokset</h1>

    <ul>
      {% for result in results %}
      <li>
        <a href="/destinations/{{ result.destination_id }}">
          {{ result.name }}
        </a>
      </li>
      {% endfor %}
    </ul>
    {% endif %}
    <a href="/destinations">Takaisin</a>
  </body>
</html>
